<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZeroTrace Pair</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>WhatsApp Pairing</h1>

  <p class="desc">
    Connect your WhatsApp bot safely using official WhatsApp pairing code.
  </p>

  <input type="text" id="number" placeholder="234xxxxxxxxxx">

  <button id="pairBtn">
    Generate Pair Code
  </button>

  <div id="loading" class="loading hidden">
    Waiting for official WhatsApp code...
  </div>

  <div id="result" class="result hidden"></div>

</div>

<script src="script.js"></script>
</body>
</html>
